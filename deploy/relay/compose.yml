# Loopback-only relay. NOT an internet deployment.
services:
  relay:
    build:
      context: .
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
